{% extends 'base.html' %}
{% block title %}Submit Complaint — HostelCare{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 py-12">
  <div class="mb-8">
    <a href="{% url 'student_dashboard' %}" class="inline-flex items-center gap-2 text-slate-400 hover:text-orange-400 text-sm transition-colors mb-6">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Back to Dashboard
    </a>
    <p class="text-orange-400 text-sm font-medium mb-1">New Complaint</p>
    <h1 class="font-display text-3xl font-800 text-white">Submit a Complaint</h1>
  </div>

  <div class="card p-8">
    <div class="accent-line mb-8"></div>
    <form method="POST" novalidate>
      {% csrf_token %}
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Complaint Title <span class="text-red-400">*</span></label>
          <input type="text" name="title" class="input-field" placeholder="Brief description of your issue" maxlength="200" required />
          <p class="text-xs text-slate-500 mt-1">Max 200 characters</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Priority Level <span class="text-red-400">*</span></label>
          <select name="priority" class="input-field">
            <option value="Low">🟡 Low — Minor inconvenience</option>
            <option value="Medium" selected>🟠 Medium — Needs attention</option>
            <option value="High">🔴 High — Urgent issue</option>
          </select>
          <div class="grid grid-cols-3 gap-3 mt-3">
            <div class="p-3 rounded-lg border border-yellow-500/20 bg-yellow-500/5 text-center">
              <div class="text-yellow-400 text-xs font-semibold mb-1">LOW</div>
              <div class="text-slate-500 text-xs">General feedback</div>
            </div>
            <div class="p-3 rounded-lg border border-orange-500/20 bg-orange-500/5 text-center">
              <div class="text-orange-400 text-xs font-semibold mb-1">MEDIUM</div>
              <div class="text-slate-500 text-xs">Needs attention soon</div>
            </div>
            <div class="p-3 rounded-lg border border-red-500/20 bg-red-500/5 text-center">
              <div class="text-red-400 text-xs font-semibold mb-1">HIGH</div>
              <div class="text-slate-500 text-xs">Urgent — affects safety</div>
            </div>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Description <span class="text-red-400">*</span></label>
          <textarea name="description" rows="6" class="input-field resize-none" placeholder="Provide detailed information about your complaint. Include location, time, and any relevant details..." required></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" class="btn-primary flex-1 py-3 rounded-xl text-base">Submit Complaint</button>
          <a href="{% url 'student_dashboard' %}" class="px-6 py-3 rounded-xl text-sm text-slate-400 hover:text-white border border-white/10 hover:border-white/20 transition-all flex items-center justify-center">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
